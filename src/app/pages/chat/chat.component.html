<div class="home-container">
  <h1 *ngIf="!logueado">Bienvenido a Sala de Chats</h1>

  <!-- Mensaje si el usuario no está logueado -->
  <div *ngIf="!logueado" class="mensaje-login">
    <p>Por favor, inicie sesión para acceder a los chats.</p>
  </div>

  <div *ngIf="logueado" class="chat-container">
    <h1>Sala de Chats</h1>
    <div class="messages" #messagesContainer>
      <div
        *ngFor="let msg of mensajes"
        [ngClass]="{
          'mi-mensaje': msg.usuario.uid === usuario.uid,
          'otros-mensaje': msg.usuario.uid !== usuario.uid
        }"
      >
        <strong class="usuario" *ngIf="msg.usuario.uid !== usuario.uid"
          >{{ msg.usuario.nombre }}:</strong
        >
        <p class="texto">
          {{ msg.texto }}
        </p>
        <p class="hora">
          {{ msg.fechaHora.toLocaleTimeString([], {
            hour: '2-digit',
            minute: '2-digit',
          }) }}
        </p>
      </div>
    </div>

    <div class="input-group">
      <input
        type="text"
        [(ngModel)]="mensaje"
        placeholder="Escribe tu mensaje..."
        (keydown.enter)="enviar()"
      />
      <button (click)="enviar()">Enviar</button>
    </div>
  </div>
</div>
