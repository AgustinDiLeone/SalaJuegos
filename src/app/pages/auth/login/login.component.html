<section class="vh-100">
    <div class="container-fluid h-custom">
      <div class="row d-flex justify-content-center align-items-center h-100">
        <div class="col-md-9 col-lg-6 col-xl-5">
          <img src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-login-form/draw2.webp"
            class="img-fluid" alt="Sample image">
        </div>
        <div class="col-md-8 col-lg-6 col-xl-4 offset-xl-1">
          <form>
            <div class="d-flex flex-row align-items-center justify-content-center justify-content-lg-start">
              <h1>Log in</h1>
            </div>

            <div class="d-flex flex-row align-items-center justify-content-center justify-content-lg-start">
                <h1 class="lead fw-normal mb-0 me-3"><br></h1>
              </div>

            <!-- Email input -->
            <div data-mdb-input-init class="form-outline mb-4">
                <label class="form-label" for="correo">Email:</label>
                <input type="email" id="correo" class="form-control form-control-lg"
                placeholder="Ej: falso@example.com" />
            </div>
  
            <!-- Password input -->
            <div data-mdb-input-init class="form-outline mb-3">
                <label class="form-label" for="password">Contraseña</label>
                <input type="password" id="password" class="form-control form-control-lg"
                placeholder="Ej: Falso1234" />
            </div>
  
            <div class="text-center text-lg-start mt-4 pt-2">
              <button  type="button" data-mdb-button-init data-mdb-ripple-init class="btn btn-primary btn-lg"
                style="padding-left: 2.5rem; padding-right: 2.5rem;">Login</button>
              <p class="small fw-bold mt-2 pt-1 mb-0">No tienes cuenta? <button routerLink="/auth/registro"
                  class="link-danger" style = border:none>Registrate</button></p>
            </div>
 
          </form>
        </div>
      </div>
    </div>
  </section>
